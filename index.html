<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#32363e">
  <title>PNTT - Haron Audio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
</head>
<body>
  <div class="player-container">
    <!-- TOP BAR -->
    <header class="top-nav">
      <button class="icon-btn" id="collapseBtn" aria-label="Thu nhỏ">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <div class="nav-title" id="navChannelTitle">PNTT - Haron Audio</div>
      <button class="icon-btn" id="drawerOpenBtnTop" aria-label="Danh sách tập">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="5" cy="12" r="2"/>
          <circle cx="12" cy="12" r="2"/>
          <circle cx="19" cy="12" r="2"/>
        </svg>
      </button>
    </header>

    <!-- ARTWORK COVER -->
    <div class="cover-wrapper">
      <div class="cover-card">
        <img id="coverImg" src="./playlists/tn.jpg" alt="Bìa truyện">

      </div>
    </div>

    <!-- TRACK INFO & CÔNG TẮC TỰ ĐỘNG CHUYỂN TẬP -->
    <section class="meta-section">
      <div class="meta-text">
        <h1 id="trackTitle">Đang tải tập...</h1>
        <p id="trackAuthor">Haron Audio</p>
      </div>

      <div class="autonext-wrap" title="Tự động chuyển tập khi kết thúc">
        <span class="autonext-label">Tự chuyển</span>
        <label class="switch">
          <input type="checkbox" id="autoNextToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <!-- SEEKBAR / PROGRESS (TỐI ƯU CẢM ỨNG & GPU) -->
    <section class="progress-section">
      <div class="slider-container" id="progressBar">
        <div class="slider-track">
          <div class="slider-fill" id="progressFill"></div>
          <div class="slider-thumb" id="progressThumb"></div>
        </div>
      </div>
      <div class="time-row">
        <span id="curTimeLabel">0:00</span>
        <span id="remTimeLabel">-0:00</span>
      </div>
    </section>

    <!-- MAIN CONTROLS (QUAY LẠI, TUA 15S, PLAY/PAUSE, TỚI 15S, TIẾP THEO) -->
    <section class="main-controls">
      <button class="ctrl-btn icon-step" id="prevEpBtn" aria-label="Tập trước" title="Tập trước">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
        </svg>
      </button>

      <button class="ctrl-btn jump-btn" id="rewind15Btn" aria-label="Lùi 15 giây" title="Tua lại 15s">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3.5 13a9 9 0 1 0 2.6-6.3L2 10" stroke-linecap="round"/>
          <polyline points="2 4 2 10 8 10" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="jump-num">15</span>
      </button>

      <button class="play-pause-btn" id="playPauseBtn" aria-label="Phát hoặc Tạm dừng">
        <svg id="playIcon" viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
          <polygon points="7 4 20 12 7 20 7 4"></polygon>
        </svg>
        <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
          <rect x="6" y="4" width="4" height="16" rx="1.5"></rect>
          <rect x="14" y="4" width="4" height="16" rx="1.5"></rect>
        </svg>
      </button>

      <button class="ctrl-btn jump-btn" id="forward15Btn" aria-label="Tới 15 giây" title="Tua tới 15s">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M20.5 13a9 9 0 1 1-2.6-6.3L22 10" stroke-linecap="round"/>
          <polyline points="22 4 22 10 16 10" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="jump-num">15</span>
      </button>

      <button class="ctrl-btn icon-step" id="nextEpBtn" aria-label="Tập tiếp theo" title="Tập sau">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
        </svg>
      </button>
    </section>

    <!-- FOOTER ACTION BAR (ĐÃ LƯỢC BỎ P1) -->
    <footer class="sub-actions">
      <div class="bottom-tools-group">
        <button class="tool-btn" id="openSpeedModalBtn" aria-label="Đổi tốc độ">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 6v6l4 2"></path>
          </svg>
          <span id="speedLabel">1x</span>
        </button>

        <button class="tool-btn" id="openTimerModalBtn" aria-label="Hẹn giờ">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="13" r="8"></circle>
            <path d="M12 9v4l2 2"></path>
            <path d="M5 3L2 6"></path>
            <path d="M22 6l-3-3"></path>
            <path d="M10 2h4"></path>
          </svg>
          <span id="timerStatusLabel">Hẹn giờ</span>
        </button>
      </div>

      <div class="bottom-actions-right">
        <button class="action-btn" id="shareBtn" aria-label="Chia sẻ" title="Chia sẻ">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
            <polyline points="16 6 12 2 8 6"></polyline>
            <line x1="12" y1="2" x2="12" y2="15"></line>
          </svg>
        </button>
        <button class="action-btn" id="drawerOpenBtn" aria-label="Danh sách tập" title="Danh sách tập">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </footer>

    <!-- POPUP MENU DOCK CHUẨN THEO ẢNH (HẸN GIỜ & TỐC ĐỘ PHÁT) -->
    <div class="dock-backdrop" id="dockBackdrop">
      <div class="dock-panel" id="dockPanel">
        <!-- Hàng 1: Dải tùy chọn viên thuốc -->
        <div class="pill-bar" id="pillOptionsBar"></div>

        <!-- Hàng 2: Ba nút cố định bên dưới -->
        <div class="dock-bottom-row">
          <button class="dock-action-tab" id="dockTabSpeed">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span id="dockSpeedText">1x</span>
          </button>

          <button class="dock-action-tab" id="dockTabTimer">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="13" r="8"></circle>
              <path d="M12 9v4l2 2"></path>
              <path d="M5 3L2 6"></path>
              <path d="M22 6l-3-3"></path>
              <path d="M10 2h4"></path>
            </svg>
            <span>Hẹn giờ</span>
          </button>

          <button class="dock-action-tab close-btn" id="dockCloseBtn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
            <span>Đóng</span>
          </button>
        </div>
      </div>
    </div>

    <!-- BOTTOM SHEET: DANH SÁCH TẬP -->
    <div class="bottom-sheet" id="bottomSheet">
      <div class="sheet-scrim" id="sheetScrim"></div>
      <div class="sheet-content">
        <div class="sheet-handle-bar">
          <div class="sheet-pill"></div>
        </div>
        <div class="sheet-header">
          <div class="sheet-tabs">
            <button class="part-tab-btn active" data-part="P1">Phần 1</button>
            <button class="part-tab-btn" data-part="P2">Phần 2</button>
          </div>
          <div class="sheet-search">
            <input type="text" id="sheetSearchInput" placeholder="Tìm số tập, tên chương...">
          </div>
        </div>
        <div class="sheet-list" id="epListContainer"></div>
      </div>
    </div>
  </div>

  <audio id="audioPlayer" preload="metadata"></audio>

  <script src="app.js"></script>
</body>
</html>
