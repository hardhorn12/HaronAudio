<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0d12">
  <title>Haron Audio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
</head>
<body>
  <!-- ẢNH NỀN FULL MÀN HÌNH (RANDOM TỪ FOLDER background/) -->
  <div class="app-bg" aria-hidden="true">
    <img id="bgBackdropImg" src="./background/tn.jpg" alt="">
    <div class="app-bg-scrim"></div>
  </div>

  <div class="player-container" id="playerContainer">
    <div class="player-main">
      <!-- TOP BAR: CHỈ GIỮ PILL CHỌN PLAYLIST -->
      <header class="top-nav">
        <button class="nav-channel-pill" id="navChannelBtn" type="button" aria-label="Chọn danh sách phát">
          <span class="nav-dot" aria-hidden="true"></span>
          <span class="nav-title" id="navChannelTitle">Haron Audio</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
      </header>

      <!-- KHOẢNG TRỐNG GIỮA ĐỂ HIỂN THỊ TRỌN VẸN ẢNH NỀN -->
      <div class="hero-spacer" aria-hidden="true"></div>

      <!-- CỤM ĐIỀU KHIỂN PHÍA DƯỚI -->
      <div class="controls-dock">
        <!-- TRACK INFO & TỰ CHUYỂN -->
        <section class="meta-section">
          <div class="meta-text">
            <h1 id="trackTitle">Đang tải tập...</h1>
            <p id="trackAuthor">Haron Audio</p>
          </div>

          <div class="autonext-wrap" title="Tự động chuyển tập khi kết thúc">
            <span class="autonext-label">Tự chuyển</span>
            <label class="switch">
              <input type="checkbox" id="autoNextToggle" checked>
              <span class="slider"></span>
            </label>
          </div>
        </section>

        <!-- SEEKBAR / PROGRESS -->
        <section class="progress-section">
          <div class="slider-container" id="progressBar" role="slider" aria-label="Tiến trình phát" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
            <div class="seek-tooltip" id="seekTooltip" aria-hidden="true">0:00</div>
            <div class="slider-track">
              <div class="slider-fill" id="progressFill"></div>
            </div>
            <div class="slider-thumb" id="progressThumb"></div>
          </div>
          <div class="time-row">
            <span id="curTimeLabel">0:00</span>
            <span id="remTimeLabel">-0:00</span>
          </div>
        </section>

        <!-- MAIN CONTROLS -->
        <section class="main-controls">
          <button class="ctrl-btn icon-step" id="prevEpBtn" aria-label="Tập trước" title="Tập trước">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
            </svg>
          </button>

          <button class="ctrl-btn jump-btn" id="rewind15Btn" aria-label="Lùi 15 giây" title="Tua lại 15s">
            <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M3.5 13a9 9 0 1 0 2.6-6.3L2 10" stroke-linecap="round"/>
              <polyline points="2 4 2 10 8 10" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="jump-num">15</span>
          </button>

          <button class="play-pause-btn" id="playPauseBtn" aria-label="Phát hoặc Tạm dừng">
            <svg id="playIcon" viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
              <polygon points="7 4 20 12 7 20 7 4"></polygon>
            </svg>
            <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
              <rect x="6" y="4" width="4" height="16" rx="1.5"></rect>
              <rect x="14" y="4" width="4" height="16" rx="1.5"></rect>
            </svg>
            <span id="loadingSpinner" class="btn-spinner hidden" aria-hidden="true"></span>
          </button>

          <button class="ctrl-btn jump-btn" id="forward15Btn" aria-label="Tới 15 giây" title="Tua tới 15s">
            <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M20.5 13a9 9 0 1 1-2.6-6.3L22 10" stroke-linecap="round"/>
              <polyline points="22 4 22 10 16 10" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="jump-num">15</span>
          </button>

          <button class="ctrl-btn icon-step" id="nextEpBtn" aria-label="Tập tiếp theo" title="Tập sau">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
            </svg>
          </button>
        </section>

        <!-- FOOTER ACTION BAR: TỐC ĐỘ PHÁT / HẸN GIỜ & DANH SÁCH TẬP -->
        <footer class="sub-actions">
          <button class="tool-btn" id="openSpeedModalBtn" aria-label="Tốc độ phát và hẹn giờ">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M12 6v6l4 2"></path>
            </svg>
            <span id="speedLabel">1.25x</span>
            <span id="timerInlineBadge" class="timer-inline hidden"></span>
          </button>

          <button class="action-btn" id="drawerOpenBtn" aria-label="Danh sách tập" title="Danh sách tập">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
        </footer>
      </div>
    </div>

    <!-- POPUP MENU DOCK (TỐC ĐỘ PHÁT & HẸN GIỜ) -->
    <div class="dock-backdrop" id="dockBackdrop" aria-hidden="true">
      <div class="dock-panel" id="dockPanel">
        <div class="pill-bar" id="pillOptionsBar"></div>

        <div class="dock-bottom-row">
          <button class="dock-action-tab active" id="dockTabSpeed" type="button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span id="dockSpeedText">1.25x</span>
          </button>

          <button class="dock-action-tab" id="dockTabTimer" type="button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="13" r="8"></circle>
              <path d="M12 9v4l2 2"></path>
              <path d="M5 3L2 6"></path>
              <path d="M22 6l-3-3"></path>
              <path d="M10 2h4"></path>
            </svg>
            <span id="dockTimerText">Hẹn giờ</span>
          </button>

          <button class="dock-action-tab close-btn" id="dockCloseBtn" type="button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
            <span>Đóng</span>
          </button>
        </div>
      </div>
    </div>

    <!-- BOTTOM SHEET (DANH SÁCH TẬP) -->
    <div class="bottom-sheet" id="bottomSheet" aria-hidden="true">
      <div class="sheet-scrim" id="sheetScrim"></div>
      <div class="sheet-content">
        <div class="sheet-handle-bar">
          <div class="sheet-pill"></div>
        </div>
        <div class="sheet-header">
          <div class="sheet-tabs" id="sheetTabs" role="tablist" aria-label="Chọn truyện / phần"></div>
          <div class="sheet-search-row">
            <div class="sheet-search">
              <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" id="sheetSearchInput" placeholder="Tìm số tập, tên chương..." autocomplete="off">
              <button class="search-clear hidden" id="searchClearBtn" type="button" aria-label="Xóa tìm kiếm">×</button>
            </div>
            <button class="scroll-active-btn" id="scrollToActiveBtn" type="button" title="Tới tập đang nghe" aria-label="Tới tập đang nghe">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path>
              </svg>
            </button>
          </div>
        </div>
        <div class="sheet-list" id="epListContainer"></div>
      </div>
    </div>

    <!-- STATUS TOAST -->
    <div id="playerStatus" class="player-status" role="status" aria-live="polite"></div>
  </div>

  <audio id="audioPlayer" preload="metadata"></audio>

  <script src="app.js"></script>
</body>
</html>
